name: Pupdate
options:
  bundleIdPrefix: com.walkbuddy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: F87457F436
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Pupdate:
    type: application
    platform: iOS
    sources:
      - path: Pupdate/Sources
      - path: Pupdate/Shared
      - path: Pupdate/Resources
        buildPhase: resources
    dependencies:
      - target: PupdateWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkbuddy.app.F87457F436
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Pupdate/Info.plist
      properties:
        CFBundleDisplayName: Pupdate
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location]
        NSLocationAlwaysAndWhenInUseUsageDescription: During a walk Pupdate keeps sharing your location with the screen locked so your friends can find you.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pupdate]
        UIAppFonts:
          - BricolageGrotesque_800ExtraBold.ttf
          - BricolageGrotesque_700Bold.ttf
          - Figtree_500Medium.ttf
          - Figtree_600SemiBold.ttf
          - Figtree_700Bold.ttf
        NSLocationWhenInUseUsageDescription: Pupdate shares your location during a walk so your friends can find you if you stop answering.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WBDefaultServer: https://45-76-67-21.sslip.io
  PupdateWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PupdateWidgets
      - path: Pupdate/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkbuddy.app.F87457F436.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: PupdateWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pupdate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PupdateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PupdateUITests
    dependencies:
      - target: Pupdate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkbuddy.app.F87457F436.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pupdate
schemes:
  Pupdate:
    build:
      targets:
        Pupdate: all
        PupdateWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PupdateUITests
